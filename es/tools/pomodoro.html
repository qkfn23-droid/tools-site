<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Pomodoro - MOGU Tools</title>
    <meta name="description" content="Temporizador Pomodoro: 25 min de trabajo + 5 min de descanso. Mejora tu concentración.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:500px;margin:10px auto 40px;padding:0 20px;text-align:center}h1{font-size:24px;font-weight:700;margin-bottom:24px}.timer-box{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:40px;margin-bottom:20px}.mode-btns{display:flex;gap:8px;justify-content:center;margin-bottom:24px}.mode-btn{padding:10px 20px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}.mode-btn.active{border-color:#e74c3c;background:#e74c3c;color:#fff}.mode-btn.break.active{border-color:#27ae60;background:#27ae60;color:#fff}.time-display{font-size:80px;font-weight:700;font-variant-numeric:tabular-nums;margin:20px 0}.time-display.work{color:#e74c3c}.time-display.break{color:#27ae60}.status{font-size:14px;color:#888;margin-bottom:20px}.ctrl-btns{display:flex;gap:12px;justify-content:center}.ctrl-btn{padding:14px 28px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;min-width:100px}.ctrl-btn:active{transform:scale(0.95)}.btn-start{background:#e74c3c;color:#fff}.btn-stop{background:#888;color:#fff}.btn-reset{background:#eee;color:#666}.sessions{margin-top:16px;font-size:14px;color:#888}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🍅 Temporizador Pomodoro</h1>
    <div class="timer-box">
        <div class="mode-btns">
            <button class="mode-btn active" onclick="setMode('work')">Trabajo 25 min</button>
            <button class="mode-btn break" onclick="setMode('short')">Descanso corto 5 min</button>
            <button class="mode-btn break" onclick="setMode('long')">Descanso largo 15 min</button>
        </div>
        <div class="time-display work" id="display">25:00</div>
        <div class="status" id="status">Pulsa Iniciar</div>
        <div class="ctrl-btns">
            <button class="ctrl-btn btn-start" id="startBtn" onclick="toggle()">Iniciar</button>
            <button class="ctrl-btn btn-reset" onclick="reset()">Reiniciar</button>
        </div>
        <div class="sessions" id="sessions">Sesiones completadas: 0</div>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const MODES={work:25*60,short:5*60,long:15*60};
let mode='work',timeLeft=MODES.work,running=false,interval=null,sessions=0;
function setMode(m){mode=m;timeLeft=MODES[m];running=false;if(interval)clearInterval(interval);interval=null;render();document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.getElementById('startBtn').textContent='Iniciar';document.getElementById('startBtn').className='ctrl-btn btn-start';document.getElementById('status').textContent='Pulsa Iniciar';}
function render(){const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('display').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('display').className='time-display '+(mode==='work'?'work':'break');}
function toggle(){if(running){running=false;clearInterval(interval);document.getElementById('startBtn').textContent='Continuar';document.getElementById('status').textContent='Pausado';}else{running=true;document.getElementById('startBtn').textContent='Pausar';document.getElementById('startBtn').className='ctrl-btn btn-stop';document.getElementById('status').textContent=mode==='work'?'🔥 Trabajando...':'☕ Descansando...';interval=setInterval(()=>{timeLeft--;render();if(timeLeft<=0){clearInterval(interval);running=false;if(mode==='work'){sessions++;document.getElementById('sessions').textContent='Sesiones completadas: '+sessions;}document.getElementById('status').textContent='⏰ ¡Completado!';document.getElementById('startBtn').textContent='Iniciar';try{new Audio('data:audio/wav;base64,UklGRl9vT19teleWQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQ').play();}catch(e){}}},1000);}}
function reset(){running=false;if(interval)clearInterval(interval);timeLeft=MODES[mode];render();document.getElementById('startBtn').textContent='Iniciar';document.getElementById('startBtn').className='ctrl-btn btn-start';document.getElementById('status').textContent='Pulsa Iniciar';}
render();
</script>
</body>
</html>
