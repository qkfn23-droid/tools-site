<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Emojis - MOGU Tools</title>
    <meta name="description" content="Busca emojis y haz clic para copiarlos.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:16px}input[type=text]{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none;margin-bottom:16px}input:focus{border-color:#4a90d9}.copied{font-size:13px;color:#27ae60;min-height:20px;margin-bottom:8px}.grid{display:flex;flex-wrap:wrap;gap:4px}.emoji-btn{width:44px;height:44px;border:none;background:#fff;border-radius:8px;font-size:24px;cursor:pointer;transition:transform 0.1s}.emoji-btn:hover{transform:scale(1.3);background:#f0f6fd}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>😀 Buscador de Emojis</h1>
    <p class="subtitle">Haz clic para copiar. Busca por nombre en español o inglés.</p>
    <input type="text" id="search" placeholder="Buscar: sonrisa, corazón, estrella, animal..." oninput="filter()">
    <div class="copied" id="copied"></div>
    <div class="grid" id="grid"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const EMOJIS=[
{e:'😀',k:'smile grin happy sonrisa feliz'},{e:'😂',k:'laugh cry tears risa llanto'},{e:'🥹',k:'touched emocionado'},{e:'😍',k:'love heart eyes amor corazón'},{e:'😎',k:'cool sunglasses genial gafas'},{e:'🤔',k:'think pensar reflexión'},{e:'😢',k:'sad cry triste llanto'},{e:'😡',k:'angry enojado furioso'},{e:'🥺',k:'please cute tierno ruego'},{e:'😱',k:'shock scream susto grito'},{e:'🤣',k:'rofl carcajada risa'},{e:'😴',k:'sleep dormir sueño'},{e:'🤮',k:'vomit sick enfermo náuseas'},{e:'🤯',k:'explode mind blown alucinante'},
{e:'❤️',k:'heart love red corazón amor rojo'},{e:'💔',k:'broken heart corazón roto'},{e:'💕',k:'hearts love corazones amor'},{e:'🔥',k:'fire hot fuego caliente'},{e:'⭐',k:'star estrella'},{e:'✨',k:'sparkle shine brillo destellos'},{e:'🌈',k:'rainbow arcoíris'},{e:'☀️',k:'sun sol'},{e:'🌙',k:'moon luna'},{e:'❄️',k:'snow nieve'},{e:'🌸',k:'cherry blossom flor cerezo'},{e:'🌹',k:'rose rosa'},
{e:'👍',k:'thumbs up good bien aprobado'},{e:'👎',k:'thumbs down bad mal'},{e:'👏',k:'clap aplausos'},{e:'🙏',k:'pray please thanks gracias oración'},{e:'💪',k:'muscle strong fuerza músculo'},{e:'✌️',k:'peace victory paz victoria'},{e:'🤝',k:'handshake deal acuerdo apretón'},{e:'👋',k:'wave hello bye hola adiós'},
{e:'🐶',k:'dog perro'},{e:'🐱',k:'cat gato'},{e:'🐻',k:'bear oso'},{e:'🐼',k:'panda'},{e:'🦊',k:'fox zorro'},{e:'🐵',k:'monkey mono'},{e:'🐷',k:'pig cerdo'},{e:'🐸',k:'frog rana'},{e:'🦋',k:'butterfly mariposa'},{e:'🐍',k:'snake serpiente'},
{e:'🍎',k:'apple manzana'},{e:'🍕',k:'pizza'},{e:'🍔',k:'burger hamburguesa'},{e:'🍟',k:'fries papas fritas'},{e:'🍜',k:'noodle fideos ramen'},{e:'🍣',k:'sushi'},{e:'🍺',k:'beer cerveza'},{e:'☕',k:'coffee café'},{e:'🎂',k:'cake birthday pastel cumpleaños'},
{e:'🎉',k:'party celebrate fiesta celebrar'},{e:'🎊',k:'confetti celebración'},{e:'🎁',k:'gift present regalo'},{e:'🏆',k:'trophy winner trofeo ganador'},{e:'🎵',k:'music note música nota'},{e:'🎮',k:'game controller videojuego'},{e:'📱',k:'phone mobile teléfono móvil'},{e:'💻',k:'laptop computer portátil ordenador'},{e:'📧',k:'email mail correo'},{e:'📷',k:'camera photo cámara foto'},
{e:'✅',k:'check done completado verificado'},{e:'❌',k:'x wrong no error incorrecto'},{e:'⚠️',k:'warning advertencia'},{e:'💡',k:'idea bulb bombilla'},{e:'🔑',k:'key llave'},{e:'🔒',k:'lock candado'},{e:'⏰',k:'alarm clock alarma reloj'},{e:'📌',k:'pin fijar'},{e:'🗑️',k:'trash delete basura eliminar'},{e:'💯',k:'100 perfect perfecto cien'}
];
function render(list){document.getElementById('grid').innerHTML=list.map(e=>`<button class="emoji-btn" onclick="copy('${e.e}')">${e.e}</button>`).join('');}
function filter(){const q=document.getElementById('search').value.toLowerCase();const filtered=q?EMOJIS.filter(e=>e.k.includes(q)):EMOJIS;render(filtered);}
function copy(e){navigator.clipboard.writeText(e);document.getElementById('copied').textContent=`${e} ¡copiado!`;setTimeout(()=>document.getElementById('copied').textContent='',1500);}
render(EMOJIS);
</script>
</body>
</html>
