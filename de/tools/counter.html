<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zähler - MOGU Tools</title>
    <meta name="description" content="Einfacher Zähler. Mit +/- Tasten bedienen.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:400px;margin:10px auto 40px;padding:0 20px;text-align:center}h1{font-size:24px;font-weight:700;margin-bottom:24px}.counter-box{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:40px;margin-bottom:20px}.count{font-size:96px;font-weight:700;color:#4a90d9;font-variant-numeric:tabular-nums;margin:20px 0;user-select:none}.btn-row{display:flex;gap:12px;justify-content:center}.cbtn{width:70px;height:70px;border-radius:50%;border:none;font-size:32px;font-weight:700;cursor:pointer;transition:transform 0.1s}.cbtn:active{transform:scale(0.9)}.cbtn-minus{background:#e74c3c;color:#fff}.cbtn-plus{background:#27ae60;color:#fff}.cbtn-reset{background:#eee;color:#666;width:50px;height:50px;font-size:14px;margin-top:10px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Zähler</h1>
    <div class="counter-box">
        <div class="count" id="count">0</div>
        <div class="btn-row">
            <button class="cbtn cbtn-minus" onclick="add(-1)">−</button>
            <button class="cbtn cbtn-plus" onclick="add(1)">+</button>
        </div>
        <button class="cbtn cbtn-reset" onclick="reset()">Reset</button>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
let count=0;
function add(n){count+=n;document.getElementById('count').textContent=count;document.getElementById('count').style.color=count>0?'#27ae60':count<0?'#e74c3c':'#4a90d9';}
function reset(){count=0;document.getElementById('count').textContent='0';document.getElementById('count').style.color='#4a90d9';}
</script>
</body>
</html>
