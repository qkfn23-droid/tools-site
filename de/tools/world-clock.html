<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltzeit - MOGU Tools</title>
    <meta name="description" content="Aktuelle Uhrzeit in den wichtigsten Städten der Welt.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.clock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.clock-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;text-align:center}.clock-card .city{font-size:14px;font-weight:600;color:#555;margin-bottom:4px}.clock-card .time{font-size:28px;font-weight:700;color:#4a90d9;font-variant-numeric:tabular-nums}.clock-card .date{font-size:11px;color:#999;margin-top:2px}.clock-card .offset{font-size:11px;color:#aaa}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🌍 Weltzeit</h1>
    <p class="subtitle">Aktuelle Uhrzeit in den wichtigsten Städten der Welt</p>
    <div class="clock-grid" id="grid"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const CITIES=[
{name:'Seoul',tz:'Asia/Seoul'},{name:'Tokio',tz:'Asia/Tokyo'},{name:'Peking',tz:'Asia/Shanghai'},
{name:'Neu-Delhi',tz:'Asia/Kolkata'},{name:'Dubai',tz:'Asia/Dubai'},{name:'Istanbul',tz:'Europe/Istanbul'},
{name:'Moskau',tz:'Europe/Moscow'},{name:'London',tz:'Europe/London'},{name:'Paris',tz:'Europe/Paris'},
{name:'Berlin',tz:'Europe/Berlin'},{name:'New York',tz:'America/New_York'},{name:'Chicago',tz:'America/Chicago'},
{name:'Los Angeles',tz:'America/Los_Angeles'},{name:'São Paulo',tz:'America/Sao_Paulo'},{name:'Sydney',tz:'Australia/Sydney'},
{name:'Auckland',tz:'Pacific/Auckland'}
];
function update(){const grid=document.getElementById('grid');grid.innerHTML='';CITIES.forEach(c=>{const now=new Date();const opts={timeZone:c.tz};const time=now.toLocaleTimeString('de-DE',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const date=now.toLocaleDateString('de-DE',{...opts,month:'short',day:'numeric',weekday:'short'});const offset=new Intl.DateTimeFormat('en',{timeZone:c.tz,timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName')?.value||'';const hour=parseInt(time.split(':')[0]);const isNight=hour<6||hour>=21;grid.innerHTML+=`<div class="clock-card" style="${isNight?'background:#1a1a2e;border-color:#2a2a4e;':''}"><div class="city" style="${isNight?'color:#aaa;':''}">${isNight?'🌙':'☀️'} ${c.name}</div><div class="time" style="${isNight?'color:#7eb8da;':''}">${time}</div><div class="date" style="${isNight?'color:#666;':''}">${date}</div><div class="offset">${offset}</div></div>`;});}
update();setInterval(update,1000);
</script>
</body>
</html>
