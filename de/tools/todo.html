<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgabenliste - MOGU Tools</title>
    <meta name="description" content="Aufgabenverwaltung. Wird automatisch im Browser gespeichert.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}.add-row{display:flex;gap:8px;margin-bottom:16px}.add-row input{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}.add-row input:focus{border-color:#4a90d9}.add-row button{padding:12px 20px;background:#4a90d9;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}.todo-list{background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden}.todo-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0f0;gap:10px}.todo-item:last-child{border-bottom:none}.todo-item input[type=checkbox]{width:20px;height:20px;accent-color:#4a90d9}.todo-item .text{flex:1;font-size:14px}.todo-item .text.done{text-decoration:line-through;color:#ccc}.todo-item .del{background:none;border:none;font-size:18px;cursor:pointer;color:#e74c3c;padding:4px}.stats{font-size:13px;color:#888;margin-top:12px;text-align:center}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>✅ Aufgabenliste</h1>
    <div class="add-row"><input type="text" id="newTodo" placeholder="Neue Aufgabe eingeben..." onkeydown="if(event.key==='Enter')add()"><button onclick="add()">Hinzufügen</button></div>
    <div class="todo-list" id="list"></div>
    <div class="stats" id="stats"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
let todos=JSON.parse(localStorage.getItem('moguTodos')||'[]');
function save(){localStorage.setItem('moguTodos',JSON.stringify(todos));render();}
function add(){const v=document.getElementById('newTodo').value.trim();if(!v)return;todos.push({text:v,done:false});document.getElementById('newTodo').value='';save();}
function toggle(i){todos[i].done=!todos[i].done;save();}
function del(i){todos.splice(i,1);save();}
function render(){const list=document.getElementById('list');list.innerHTML=todos.map((t,i)=>`<div class="todo-item"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><span class="text ${t.done?'done':''}">${t.text}</span><button class="del" onclick="del(${i})">×</button></div>`).join('');
const done=todos.filter(t=>t.done).length;document.getElementById('stats').textContent=`${done}/${todos.length} erledigt`;}
render();
</script>
</body>
</html>
