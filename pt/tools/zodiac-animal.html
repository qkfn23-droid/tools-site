<!DOCTYPE html>
<html lang="pt">
<head>

    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px;text-align:center}h1{font-size:24px;font-weight:700;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:30px}input{padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:20px;text-align:center;width:150px;outline:none;margin-bottom:20px}input:focus{border-color:#4a90d9}.emoji{font-size:80px;margin:16px 0}.name{font-size:28px;font-weight:700;color:#4a90d9}.desc{font-size:14px;color:#666;margin-top:12px;line-height:1.7;text-align:left}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🐲 Signo Chinês</h1>
    <div class="calc-box">
        <input type="number" id="year" value="1995" min="1900" max="2100" oninput="calc()">
        <div class="emoji" id="emoji">🐷</div>
        <div class="name" id="name">Porco</div>
        <div class="desc" id="desc"></div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>

<script>
const ANIMALS=[
    {e:'🐀',n:'Rato',d:'Inteligente e adaptável. Sociável e com grande senso de oportunidade.'},
    {e:'🐂',n:'Boi',d:'Diligente e paciente. Confiável e trabalhador incansável.'},
    {e:'🐅',n:'Tigre',d:'Corajoso e cheio de confiança. Líder nato com forte senso de justiça.'},
    {e:'🐇',n:'Coelho',d:'Gentil e sensível. Grande senso artístico e amor pela paz.'},
    {e:'🐉',n:'Dragão',d:'Carismático e ambicioso. Cheio de energia e orientado ao sucesso.'},
    {e:'🐍',n:'Cobra',d:'Sábio e misterioso. Intuitivo e com grande profundidade interior.'},
    {e:'🐴',n:'Cavalo',d:'Ativo e espírito livre. Adora aventura e transborda energia.'},
    {e:'🐑',n:'Cabra',d:'Gentil e artístico. Compassivo e prefere ambientes tranquilos.'},
    {e:'🐵',n:'Macaco',d:'Espirituoso e inteligente. Curioso e excelente resolução de problemas.'},
    {e:'🐔',n:'Galo',d:'Trabalhador e observador. Honesto e direto.'},
    {e:'🐶',n:'Cão',d:'Leal e fiel. Forte senso de justiça e sempre disposto a ajudar.'},
    {e:'🐷',n:'Porco',d:'Generoso e otimista. Paciente e de coração verdadeiro.'}
];
function calc(){const y=parseInt(document.getElementById('year').value);if(isNaN(y))return;const idx=(y-4)%12;const a=ANIMALS[idx<0?idx+12:idx];document.getElementById('emoji').textContent=a.e;document.getElementById('name').textContent=a.n+` (nascido em ${y})`;document.getElementById('desc').textContent=a.d;}
calc();
</script>
