<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testador de Regex - MOGU Tools</title>
    <meta name="description" content="Teste expressões regulares em tempo real. Destaque de correspondências.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.regex-input{display:flex;align-items:center;background:#fff;border:2px solid #e0e0e0;border-radius:8px;padding:4px;margin-bottom:12px}.regex-input span{color:#999;padding:0 8px;font-size:18px}.regex-input input{flex:1;border:none;font-size:16px;font-family:'Fira Code',monospace;padding:10px 4px;outline:none}.regex-input .flags{display:flex;gap:4px;padding:0 8px}.regex-input .flag{padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;font-family:monospace}.regex-input .flag.active{background:#4a90d9;color:#fff;border-color:#4a90d9}textarea{width:100%;height:200px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:monospace;resize:vertical;outline:none;margin-bottom:12px}textarea:focus{border-color:#4a90d9}.result-area{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:16px;margin-bottom:12px;font-family:monospace;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-all;min-height:100px}.result-area mark{background:#ffeaa7;padding:1px 2px;border-radius:2px}.status{font-size:13px;color:#888;margin-bottom:12px}.error{color:#e74c3c}label{font-size:13px;color:#555;font-weight:500;display:block;margin-bottom:6px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Testador de Regex</h1>
    <p class="subtitle">Teste expressões regulares em tempo real.</p>
    <label>Expressão regular</label>
    <div class="regex-input">
        <span>/</span>
        <input type="text" id="pattern" placeholder="[a-z]+" oninput="test()">
        <span>/</span>
        <div class="flags">
            <span class="flag active" onclick="toggleFlag(this,'g')">g</span>
            <span class="flag active" onclick="toggleFlag(this,'i')">i</span>
            <span class="flag" onclick="toggleFlag(this,'m')">m</span>
        </div>
    </div>
    <label>Texto de teste</label>
    <textarea id="testStr" oninput="test()" placeholder="Digite o texto para testar aqui...">Hello World 123 Olá Brasil test@email.com https://mogutool.com</textarea>
    <div class="status" id="status"></div>
    <label>Resultado das correspondências</label>
    <div class="result-area" id="result"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
let flags='gi';
function toggleFlag(el,f){el.classList.toggle('active');if(flags.includes(f))flags=flags.replace(f,'');else flags+=f;test();}
function test(){const pattern=document.getElementById('pattern').value;const str=document.getElementById('testStr').value;if(!pattern){document.getElementById('result').textContent=str;document.getElementById('status').textContent='';return;}
try{const re=new RegExp(pattern,flags);const matches=[...str.matchAll(new RegExp(pattern,flags.includes('g')?flags:flags+'g'))];document.getElementById('status').innerHTML=`<span style="color:#27ae60">✅ Regex válido</span> — ${matches.length} correspondência(s)`;let html=str.replace(re,'<mark>$&</mark>');document.getElementById('result').innerHTML=html;}catch(e){document.getElementById('status').innerHTML=`<span class="error">❌ ${e.message}</span>`;document.getElementById('result').textContent=str;}}
test();
</script>
</body>
</html>
