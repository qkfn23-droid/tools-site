<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatador JSON - MOGU Tools</title>
    <meta name="description" content="Formate e valide JSON de forma legível. Suporte a minificação (minify).">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        header { background: #fff; border-bottom: 2px solid #eee; padding: 16px 20px; }
        header a { text-decoration: none; color: #2c2c2c; font-size: 18px; font-weight: 700; }
        header a span { color: #4a90d9; }
        .breadcrumb { max-width: 800px; margin: 16px auto; padding: 0 20px; font-size: 13px; color: #999; }
        .breadcrumb a { color: #4a90d9; text-decoration: none; }
        .container { max-width: 800px; margin: 10px auto 40px; padding: 0 20px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

        .editor-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .editor-box label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 200px; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; font-family: 'Fira Code', 'Consolas', monospace; resize: vertical; outline: none; line-height: 1.5; tab-size: 2; }
        textarea:focus { border-color: #4a90d9; }

        .btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; font-weight: 500; }
        .btn:hover { border-color: #4a90d9; color: #4a90d9; }
        .btn-primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
        .btn-primary:hover { background: #3a7bc8; color: #fff; }

        .status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .status.valid { background: #f0f9f0; color: #27ae60; border: 1px solid #c3e6c3; display: block; }
        .status.invalid { background: #fdf0f0; color: #e74c3c; border: 1px solid #f5c6cb; display: block; }

        footer { text-align: center; padding: 30px; color: #bbb; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <a href="../index.html">MOGU <span>Tools</span></a>
</header>

<div class="breadcrumb">
    <a href="../index.html">Início</a> &gt; Ferramentas &gt; Formatador JSON
</div>

<div class="container">
    <h1>Formatador JSON</h1>
    <p class="subtitle">Formate e valide JSON de forma legível. Suporte a minificação.</p>

    <div class="editor-box">
        <label>JSON de entrada</label>
        <textarea id="input" placeholder='{"name":"MOGU","tools":43}'></textarea>
    </div>

    <div class="btn-row">
        <button class="btn btn-primary" onclick="formatJSON()">✨ Formatar (Beautify)</button>
        <button class="btn" onclick="minifyJSON()">📦 Minificar (Minify)</button>
        <button class="btn" onclick="validateJSON()">✅ Validar</button>
        <button class="btn" onclick="copyOutput()">📋 Copiar</button>
        <button class="btn" onclick="clearAll()">🗑️ Limpar</button>
    </div>

    <div class="status" id="status"></div>

    <div class="editor-box">
        <label>Resultado</label>
        <textarea id="output" readonly style="background:#f8f9fa;"></textarea>
    </div>
</div>

<footer>&copy; 2025 MOGU Tools</footer>

<script>
function formatJSON() {
    try {
        const obj = JSON.parse(document.getElementById('input').value);
        document.getElementById('output').value = JSON.stringify(obj, null, 2);
        showStatus('valid', '✅ JSON válido.');
    } catch (e) {
        showStatus('invalid', '❌ Erro no JSON: ' + e.message);
    }
}

function minifyJSON() {
    try {
        const obj = JSON.parse(document.getElementById('input').value);
        document.getElementById('output').value = JSON.stringify(obj);
        showStatus('valid', '✅ Minificação concluída.');
    } catch (e) {
        showStatus('invalid', '❌ Erro no JSON: ' + e.message);
    }
}

function validateJSON() {
    try {
        const obj = JSON.parse(document.getElementById('input').value);
        const keys = JSON.stringify(obj, null, 2).split('\n').length;
        showStatus('valid', `✅ JSON válido. (${keys} linhas)`);
    } catch (e) {
        showStatus('invalid', '❌ Erro no JSON: ' + e.message);
    }
}

function copyOutput() {
    const output = document.getElementById('output');
    output.select();
    document.execCommand('copy');
    showStatus('valid', '📋 Copiado!');
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('status').style.display = 'none';
}

function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'status ' + type;
    el.textContent = msg;
}
</script>

</body>
</html>
