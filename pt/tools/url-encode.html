<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codificador/Decodificador de URL - MOGU Tools</title>
    <meta name="description" content="Codifique ou decodifique URLs com caracteres especiais.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}textarea{width:100%;height:120px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:monospace;resize:vertical;outline:none;margin-bottom:12px}textarea:focus{border-color:#4a90d9}.btn-row{display:flex;gap:8px;margin-bottom:16px}.btn{padding:10px 20px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-weight:500}.btn:hover{border-color:#4a90d9;color:#4a90d9}.btn-primary{background:#4a90d9;color:#fff;border-color:#4a90d9}label{font-size:13px;color:#555;display:block;margin-bottom:6px;font-weight:500}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Codificador / Decodificador de URL</h1>
    <p class="subtitle">Codifique ou decodifique caracteres especiais de URLs.</p>
    <label>Entrada</label>
    <textarea id="input" placeholder="https://example.com/busca?q=olá"></textarea>
    <div class="btn-row">
        <button class="btn btn-primary" onclick="doEncode()">Codificar →</button>
        <button class="btn btn-primary" onclick="doDecode()">← Decodificar</button>
        <button class="btn" onclick="copy()">📋 Copiar</button>
    </div>
    <label>Resultado</label>
    <textarea id="output" readonly style="background:#f8f9fa;"></textarea>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'<footer>text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function doEncode(){document.getElementById('output').value=encodeURIComponent(document.getElementById('input').value);}
function doDecode(){try{document.getElementById('output').value=decodeURIComponent(document.getElementById('input').value);}catch(e){document.getElementById('output').value='❌ Erro ao decodificar: '+e.message;}}
function copy(){document.getElementById('output').select();document.execCommand('copy');}
</script>
</body>
</html>
