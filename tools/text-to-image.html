<!DOCTYPE html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>텍스트 → 이미지 - MOGU Tools</title><meta name="description" content="텍스트를 이미지로 변환합니다."><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;margin-bottom:6px;color:#555}.input-group textarea,.input-group input,.input-group select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}.input-row{display:flex;gap:8px}.input-row>*{flex:1}.btn{width:100%;padding:14px;background:#4a90d9;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-bottom:16px}canvas{display:block;margin:0 auto;border-radius:8px;max-width:100%}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style></head><body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container"><h1>🖼️ 텍스트 → 이미지</h1>
<div class="calc-box">
<div class="input-group"><label>텍스트</label><textarea id="text" rows="3" oninput="render()">MOGU Tools</textarea></div>
<div class="input-row">
<div class="input-group"><label>글꼴 크기</label><input type="number" id="size" value="48" oninput="render()"></div>
<div class="input-group"><label>글꼴 색상</label><input type="color" id="color" value="#333333" oninput="render()"></div>
<div class="input-group"><label>배경 색상</label><input type="color" id="bg" value="#ffffff" oninput="render()"></div>
</div>
<button class="btn" onclick="download()">💾 이미지 다운로드</button>
<canvas id="canvas"></canvas>
</div></div><footer>&copy; 2025 MOGU Tools</footer>
<script>
function render(){const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const text=document.getElementById('text').value||' ';const size=parseInt(document.getElementById('size').value)||48;ctx.font=size+'px sans-serif';const lines=text.split('\n');const widths=lines.map(l=>ctx.measureText(l).width);canvas.width=Math.max(...widths)+size;canvas.height=lines.length*(size*1.3)+size;ctx.fillStyle=document.getElementById('bg').value;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=document.getElementById('color').value;ctx.font=size+'px sans-serif';ctx.textBaseline='top';lines.forEach((l,i)=>ctx.fillText(l,size/2,size/2+i*size*1.3));}
function download(){const a=document.createElement('a');a.download='text-image.png';a.href=document.getElementById('canvas').toDataURL();a.click();}
render();
</script></body></html>
