<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 계산기 - EZ Tools</title>
    <meta name="description" content="키와 몸무게를 입력하면 BMI(체질량지수)를 계산하고 비만도를 알려드립니다.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #fff;
            border-bottom: 2px solid #eee;
            padding: 16px 20px;
        }

        header a {
            text-decoration: none;
            color: #2c2c2c;
            font-size: 18px;
            font-weight: 700;
        }

        header a span {
            color: #4a90d9;
        }

        .breadcrumb {
            max-width: 600px;
            margin: 16px auto;
            padding: 0 20px;
            font-size: 13px;
            color: #999;
        }

        .breadcrumb a {
            color: #4a90d9;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 10px auto 40px;
            padding: 0 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .calc-box {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #4a90d9;
        }

        .input-row .unit {
            font-size: 14px;
            color: #999;
            min-width: 30px;
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: #3a7bc8;
        }

        .result {
            display: none;
            margin-top: 24px;
            text-align: center;
            padding: 24px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .result .bmi-number {
            font-size: 48px;
            font-weight: 700;
        }

        .result .bmi-label {
            font-size: 18px;
            font-weight: 600;
            margin-top: 6px;
        }

        .result .bmi-range {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }

        .bmi-table {
            margin-top: 24px;
            width: 100%;
            border-collapse: collapse;
        }

        .bmi-table th, .bmi-table td {
            padding: 10px 14px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        .bmi-table th {
            color: #888;
            font-weight: 500;
        }

        .bmi-table tr.active {
            background: #eef4fb;
            font-weight: 600;
        }

        .color-underweight { color: #5bc0de; }
        .color-normal { color: #5cb85c; }
        .color-overweight { color: #f0ad4e; }
        .color-obese { color: #d9534f; }
        .color-extreme { color: #c9302c; }

        .info-section {
            margin-top: 30px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 24px;
        }

        .info-section h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #555;
        }

        .info-section p {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #bbb;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <a href="../index.html">EZ <span>Tools</span></a>
</header>

<div class="breadcrumb">
    <a href="../index.html">홈</a> &gt; 계산기 &gt; BMI 계산기
</div>

<div class="container">
    <h1>BMI 계산기</h1>
    <p class="subtitle">키와 몸무게를 입력하면 체질량지수(BMI)를 계산합니다.</p>

    <div class="calc-box">
        <div class="input-group">
            <label>키</label>
            <div class="input-row">
                <input type="number" id="height" placeholder="170" step="0.1" min="50" max="250">
                <span class="unit">cm</span>
            </div>
        </div>

        <div class="input-group">
            <label>몸무게</label>
            <div class="input-row">
                <input type="number" id="weight" placeholder="65" step="0.1" min="10" max="500">
                <span class="unit">kg</span>
            </div>
        </div>

        <button class="calc-btn" onclick="calculate()">계산하기</button>

        <div class="result" id="result">
            <div class="bmi-number" id="bmiNumber">-</div>
            <div class="bmi-label" id="bmiLabel">-</div>
            <div class="bmi-range" id="bmiRange">-</div>

            <table class="bmi-table">
                <tr>
                    <th>분류</th>
                    <th>BMI 범위</th>
                </tr>
                <tr id="row-underweight">
                    <td class="color-underweight">저체중</td>
                    <td>18.5 미만</td>
                </tr>
                <tr id="row-normal">
                    <td class="color-normal">정상</td>
                    <td>18.5 ~ 22.9</td>
                </tr>
                <tr id="row-overweight">
                    <td class="color-overweight">과체중</td>
                    <td>23 ~ 24.9</td>
                </tr>
                <tr id="row-obese">
                    <td class="color-obese">비만</td>
                    <td>25 ~ 29.9</td>
                </tr>
                <tr id="row-extreme">
                    <td class="color-extreme">고도비만</td>
                    <td>30 이상</td>
                </tr>
            </table>
        </div>
    </div>

    <div class="info-section">
        <h2>BMI란?</h2>
        <p>
            BMI(Body Mass Index, 체질량지수)는 체중(kg)을 키(m)의 제곱으로 나눈 값입니다.
            비만도를 판단하는 가장 보편적인 지표로 사용됩니다.
            위 기준은 대한비만학회의 아시아-태평양 기준을 따릅니다.
        </p>
    </div>
</div>

<footer>
    &copy; 2025 EZ Tools
</footer>

<script>
function calculate() {
    const height = parseFloat(document.getElementById('height').value);
    const weight = parseFloat(document.getElementById('weight').value);

    if (!height || !weight || height <= 0 || weight <= 0) {
        alert('키와 몸무게를 올바르게 입력해주세요.');
        return;
    }

    const heightM = height / 100;
    const bmi = weight / (heightM * heightM);
    const bmiRound = Math.round(bmi * 10) / 10;

    let label, colorClass, rowId;
    if (bmi < 18.5) {
        label = '저체중'; colorClass = 'color-underweight'; rowId = 'row-underweight';
    } else if (bmi < 23) {
        label = '정상'; colorClass = 'color-normal'; rowId = 'row-normal';
    } else if (bmi < 25) {
        label = '과체중'; colorClass = 'color-overweight'; rowId = 'row-overweight';
    } else if (bmi < 30) {
        label = '비만'; colorClass = 'color-obese'; rowId = 'row-obese';
    } else {
        label = '고도비만'; colorClass = 'color-extreme'; rowId = 'row-extreme';
    }

    document.getElementById('bmiNumber').textContent = bmiRound;
    document.getElementById('bmiNumber').className = 'bmi-number ' + colorClass;
    document.getElementById('bmiLabel').textContent = label;
    document.getElementById('bmiLabel').className = 'bmi-label ' + colorClass;

    const normalMin = (18.5 * heightM * heightM).toFixed(1);
    const normalMax = (22.9 * heightM * heightM).toFixed(1);
    document.getElementById('bmiRange').textContent =
        '정상 체중 범위: ' + normalMin + 'kg ~ ' + normalMax + 'kg';

    document.querySelectorAll('.bmi-table tr').forEach(tr => tr.classList.remove('active'));
    document.getElementById(rowId).classList.add('active');

    document.getElementById('result').style.display = 'block';
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') calculate();
});
</script>

</body>
</html>
