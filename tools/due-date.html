<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출산 예정일 계산기 - MOGU Tools</title>
    <meta name="description" content="마지막 생리 시작일로 출산 예정일을 계산합니다.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px;margin-bottom:16px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#555}.input-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}.input-group input:focus{border-color:#4a90d9}.btn{width:100%;padding:14px;background:#e84393;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}.result{display:none;margin-top:20px;text-align:center;padding:24px;background:#fdf2f8;border-radius:12px}.result .big{font-size:32px;font-weight:700;color:#e84393}.result .detail{font-size:14px;color:#888;margin-top:12px;line-height:1.8}.disclaimer{font-size:11px;color:#aaa;margin-top:16px;text-align:center}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🤰 출산 예정일 계산기</h1>
    <p class="subtitle">마지막 생리 시작일(LMP) 기준으로 출산 예정일을 계산합니다.</p>
    <div class="calc-box">
        <div class="input-group"><label>마지막 생리 시작일</label><input type="date" id="lmp"></div>
        <button class="btn" onclick="calc()">계산하기</button>
        <div class="result" id="result">
            <div class="big" id="dueDate">-</div>
            <div class="detail" id="detail">-</div>
        </div>
    </div>
    <div class="disclaimer">⚠️ 이 계산은 네겔레 공식(Naegele's rule)에 기반한 추정치입니다. 정확한 예정일은 의사와 상담하세요.</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">공유하기:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'<footer>text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){const lmp=new Date(document.getElementById('lmp').value);if(isNaN(lmp)){alert('날짜를 선택해주세요.');return;}
const due=new Date(lmp);due.setMonth(due.getMonth()+9);due.setDate(due.getDate()+7);
const now=new Date();const diff=Math.floor((due-now)/(1000*60*60*24));
const weeks=Math.floor((now-lmp)/(1000*60*60*24*7));
const trimester=weeks<13?'1분기 (1~12주)':weeks<27?'2분기 (13~26주)':'3분기 (27~40주)';
document.getElementById('dueDate').textContent=`${due.getFullYear()}년 ${due.getMonth()+1}월 ${due.getDate()}일`;
document.getElementById('detail').innerHTML=`현재 임신 ${weeks}주차<br>출산까지 약 ${Math.max(0,diff)}일 남음<br>현재 시기: ${trimester}`;
document.getElementById('result').style.display='block';}
document.getElementById('lmp').valueAsDate=new Date(Date.now()-90*86400000);
</script>
</body>
</html>
