<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">

    <meta property="og:title" content="세계 시계 - MOGU Tools">

    <meta property="og:url" content="https://mogutool.com/tools/world-clock.html">
    <meta name="description" content="전 세계 주요 도시의 현재 시간을 확인합니다.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.clock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.clock-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;text-align:center}.clock-card .city{font-size:14px;font-weight:600;color:#555;margin-bottom:4px}.clock-card .time{font-size:28px;font-weight:700;color:#4a90d9;font-variant-numeric:tabular-nums}.clock-card .date{font-size:11px;color:#999;margin-top:2px}.clock-card .offset{font-size:11px;color:#aaa}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🌍 세계 시계</h1>
    <p class="subtitle">전 세계 주요 도시의 현재 시간</p>
    <div class="clock-grid" id="grid"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">공유하기:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const CITIES=[
{name:'서울',tz:'Asia/Seoul'},{name:'도쿄',tz:'Asia/Tokyo'},{name:'베이징',tz:'Asia/Shanghai'},
{name:'뉴델리',tz:'Asia/Kolkata'},{name:'두바이',tz:'Asia/Dubai'},{name:'이스탄불',tz:'Europe/Istanbul'},
{name:'모스크바',tz:'Europe/Moscow'},{name:'런던',tz:'Europe/London'},{name:'파리',tz:'Europe/Paris'},
{name:'베를린',tz:'Europe/Berlin'},{name:'뉴욕',tz:'America/New_York'},{name:'시카고',tz:'America/Chicago'},
{name:'LA',tz:'America/Los_Angeles'},{name:'상파울루',tz:'America/Sao_Paulo'},{name:'시드니',tz:'Australia/Sydney'},
{name:'오클랜드',tz:'Pacific/Auckland'}
];
function update(){const grid=document.getElementById('grid');grid.innerHTML='';CITIES.forEach(c=>{const now=new Date();const opts={timeZone:c.tz};const time=now.toLocaleTimeString('ko-KR',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const date=now.toLocaleDateString('ko-KR',{...opts,month:'short',day:'numeric',weekday:'short'});const offset=new Intl.DateTimeFormat('en',{timeZone:c.tz,timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName')?.value||'';const hour=parseInt(time.split(':')[0]);const isNight=hour<6||hour>=21;grid.innerHTML+=`<div class="clock-card" style="${isNight?'background:#1a1a2e;border-color:#2a2a4e;':''}"><div class="city" style="${isNight?'color:#aaa;':''}">${isNight?'🌙':'☀️'} ${c.name}</div><div class="time" style="${isNight?'color:#7eb8da;':''}">${time}</div><div class="date" style="${isNight?'color:#666;':''}">${date}</div><div class="offset">${offset}</div></div>`;});}
update();setInterval(update,1000);
</script>
</body>
</html>
