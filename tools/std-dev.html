<!DOCTYPE html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>표준편차 계산기 - MOGU Tools</title><meta name="description" content="숫자 목록의 평균, 분산, 표준편차를 계산합니다."><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}textarea{width:100%;height:120px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;background:#fff}textarea:focus{border-color:#4a90d9}.btn{width:100%;padding:14px;background:#4a90d9;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:16px;text-align:center}.result-card .val{font-size:24px;font-weight:700;color:#4a90d9}.result-card .label{font-size:12px;color:#888;margin-top:4px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style></head><body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container"><h1>📊 표준편차 계산기</h1><p class="subtitle">숫자를 입력하면 평균, 분산, 표준편차를 계산합니다.</p>
<textarea id="input" placeholder="숫자를 쉼표, 공백, 또는 줄바꿈으로 구분&#10;예: 10, 20, 30, 40, 50" oninput="calc()"></textarea>
<div class="results">
<div class="result-card"><div class="val" id="mean">-</div><div class="label">평균</div></div>
<div class="result-card"><div class="val" id="std">-</div><div class="label">표준편차 (σ)</div></div>
<div class="result-card"><div class="val" id="variance">-</div><div class="label">분산 (σ²)</div></div>
<div class="result-card"><div class="val" id="count">-</div><div class="label">데이터 수</div></div>
<div class="result-card"><div class="val" id="min">-</div><div class="label">최솟값</div></div>
<div class="result-card"><div class="val" id="max">-</div><div class="label">최댓값</div></div>
</div></div><footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){const nums=document.getElementById('input').value.split(/[,\s\n]+/).map(Number).filter(n=>!isNaN(n));
if(nums.length===0){['mean','std','variance','count','min','max'].forEach(id=>document.getElementById(id).textContent='-');return;}
const n=nums.length,mean=nums.reduce((a,b)=>a+b,0)/n;
const variance=nums.reduce((a,b)=>a+(b-mean)**2,0)/n;
const std=Math.sqrt(variance);
document.getElementById('mean').textContent=mean.toFixed(4);
document.getElementById('std').textContent=std.toFixed(4);
document.getElementById('variance').textContent=variance.toFixed(4);
document.getElementById('count').textContent=n;
document.getElementById('min').textContent=Math.min(...nums);
document.getElementById('max').textContent=Math.max(...nums);}
</script></body></html>
