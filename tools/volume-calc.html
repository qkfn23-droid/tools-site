<!DOCTYPE html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>부피 계산기 - MOGU Tools</title><meta name="description" content="구, 원기둥, 직육면체, 원뿔의 부피를 계산합니다."><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px;margin-bottom:12px}.calc-box h2{font-size:15px;color:#555;margin-bottom:12px}.input-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;font-size:14px;flex-wrap:wrap}.input-row input{width:80px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;text-align:center}.result{font-size:20px;font-weight:700;color:#4a90d9}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style></head><body>
    <link rel="canonical" href="https://mogutool.com/tools/volume-calc.html">
    <meta property="og:title" content="부피 계산기 - MOGU Tools">
    <meta property="og:description" content="구, 원기둥, 직육면체, 원뿔의 부피를 계산합니다.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mogutool.com/tools/volume-calc.html">
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container"><h1>📦 부피 계산기</h1><p class="subtitle">다양한 입체도형의 부피를 계산합니다.</p>
<div class="calc-box"><h2>📦 직육면체</h2><div class="input-row">가로<input type="number" id="bw" oninput="calcB()">× 세로<input type="number" id="bh" oninput="calcB()">× 높이<input type="number" id="bd" oninput="calcB()">= <span class="result" id="br">?</span></div></div>
<div class="calc-box"><h2>🔵 구</h2><div class="input-row">반지름<input type="number" id="sr" oninput="calcS()">→ 부피 = <span class="result" id="srr">?</span></div></div>
<div class="calc-box"><h2>🥫 원기둥</h2><div class="input-row">반지름<input type="number" id="cyr" oninput="calcCy()">높이<input type="number" id="cyh" oninput="calcCy()">= <span class="result" id="cyr2">?</span></div></div>
<div class="calc-box"><h2>🔺 원뿔</h2><div class="input-row">반지름<input type="number" id="cor" oninput="calcCo()">높이<input type="number" id="coh" oninput="calcCo()">= <span class="result" id="cor2">?</span></div></div>
</div><div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">공유하기:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calcB(){const w=parseFloat(document.getElementById('bw').value),h=parseFloat(document.getElementById('bh').value),d=parseFloat(document.getElementById('bd').value);document.getElementById('br').textContent=w&&h&&d?(w*h*d).toFixed(2):'?';}
function calcS(){const r=parseFloat(document.getElementById('sr').value);document.getElementById('srr').textContent=r?(4/3*Math.PI*r*r*r).toFixed(2):'?';}
function calcCy(){const r=parseFloat(document.getElementById('cyr').value),h=parseFloat(document.getElementById('cyh').value);document.getElementById('cyr2').textContent=r&&h?(Math.PI*r*r*h).toFixed(2):'?';}
function calcCo(){const r=parseFloat(document.getElementById('cor').value),h=parseFloat(document.getElementById('coh').value);document.getElementById('cor2').textContent=r&&h?(Math.PI*r*r*h/3).toFixed(2):'?';}
</script></body></html>
