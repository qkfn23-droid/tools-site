<!DOCTYPE html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSV → JSON 변환기 - MOGU Tools</title><meta name="description" content="CSV 데이터를 JSON으로 변환합니다."><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}textarea{width:100%;height:180px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:monospace;outline:none;margin-bottom:12px}textarea:focus{border-color:#4a90d9}.btn-row{display:flex;gap:8px;margin-bottom:12px}.btn{padding:10px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer}.btn-primary{background:#4a90d9;color:#fff;border-color:#4a90d9}label{font-size:13px;color:#555;display:block;margin-bottom:6px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style></head><body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container"><h1>📊 CSV → JSON 변환기</h1>
<label>CSV 입력 (첫 줄 = 헤더)</label>
<textarea id="input" placeholder="이름,나이,도시&#10;홍길동,30,서울&#10;김철수,25,부산" oninput="convert()"></textarea>
<div class="btn-row"><button class="btn btn-primary" onclick="convert()">변환</button><button class="btn" onclick="document.getElementById('output').select();document.execCommand('copy')">📋 복사</button></div>
<label>JSON 결과</label>
<textarea id="output" readonly style="background:#f8f9fa;"></textarea>
</div><footer>&copy; 2025 MOGU Tools</footer>
<script>
function convert(){try{const lines=document.getElementById('input').value.trim().split('\n');if(lines.length<2){document.getElementById('output').value='';return;}
const headers=lines[0].split(',').map(h=>h.trim());const data=lines.slice(1).map(line=>{const vals=line.split(',');const obj={};headers.forEach((h,i)=>obj[h]=vals[i]?.trim()||'');return obj;});
document.getElementById('output').value=JSON.stringify(data,null,2);}catch(e){document.getElementById('output').value='오류: '+e.message;}}
</script></body></html>
