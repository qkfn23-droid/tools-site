<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중복 제거 - MOGU Tools</title>
    <meta name="description" content="텍스트의 중복된 줄을 제거합니다. 한 줄씩 입력하면 중복을 없애고 결과를 보여줍니다.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #fff;
            border-bottom: 2px solid #eee;
            padding: 16px 20px;
        }

        header a {
            text-decoration: none;
            color: #2c2c2c;
            font-size: 18px;
            font-weight: 700;
        }

        header a span {
            color: #4a90d9;
        }

        .breadcrumb {
            max-width: 600px;
            margin: 16px auto;
            padding: 0 20px;
            font-size: 13px;
            color: #999;
        }

        .breadcrumb a {
            color: #4a90d9;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 10px auto 40px;
            padding: 0 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .calc-box {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: border-color 0.2s;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #4a90d9;
        }

        textarea[readonly] {
            background: #f8f9fa;
            color: #444;
            cursor: default;
        }

        textarea[readonly]:focus {
            border-color: #e0e0e0;
        }

        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            user-select: none;
        }

        .option-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4a90d9;
            cursor: pointer;
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .calc-btn:hover {
            background: #3a7bc8;
        }

        .result-area {
            display: none;
        }

        .stats {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .stats strong {
            color: #4a90d9;
            font-weight: 600;
        }

        .copy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .copy-row label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .copy-btn {
            padding: 6px 16px;
            background: #fff;
            color: #4a90d9;
            border: 2px solid #4a90d9;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .copy-btn:hover {
            background: #4a90d9;
            color: #fff;
        }

        .copy-btn.copied {
            background: #5cb85c;
            border-color: #5cb85c;
            color: #fff;
        }

        .info-section {
            margin-top: 30px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 24px;
        }

        .info-section h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #555;
        }

        .info-section p {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #bbb;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <a href="../index.html">MOGU <span>Tools</span></a>
</header>

<div class="breadcrumb">
    <a href="../index.html">홈</a> &gt; 텍스트 &gt; 중복 제거
</div>

<div class="container">
    <h1>중복 제거</h1>
    <p class="subtitle">한 줄씩 입력하면 중복된 줄을 제거합니다.</p>

    <div class="calc-box">
        <div class="input-group">
            <label>입력 (한 줄에 하나씩)</label>
            <textarea id="inputText" rows="10" placeholder="텍스트를 붙여넣으세요.&#10;중복된 줄이 제거됩니다."></textarea>
        </div>

        <div class="options-row">
            <label class="option-item">
                <input type="checkbox" id="caseSensitive" checked>
                대소문자 구분
            </label>
            <label class="option-item">
                <input type="checkbox" id="removeEmpty" checked>
                빈 줄 제거
            </label>
            <label class="option-item">
                <input type="checkbox" id="sortResult">
                정렬
            </label>
        </div>

        <button class="calc-btn" onclick="deduplicate()">중복 제거</button>

        <div class="result-area" id="resultArea">
            <p class="stats" id="stats"></p>
            <div class="copy-row">
                <label>결과</label>
                <button class="copy-btn" id="copyBtn" onclick="copyResult()">복사</button>
            </div>
            <textarea id="outputText" rows="10" readonly></textarea>
        </div>
    </div>

    <div class="info-section">
        <h2>사용 방법</h2>
        <p>
            텍스트를 위 입력란에 붙여넣고 "중복 제거" 버튼을 누르세요.
            줄 단위로 중복을 감지하며, 대소문자 구분 여부와 빈 줄 처리, 정렬 옵션을 선택할 수 있습니다.
        </p>
    </div>
</div>

<footer>
    &copy; 2025 MOGU Tools
</footer>

<script>
function deduplicate() {
    const raw = document.getElementById('inputText').value;
    const caseSensitive = document.getElementById('caseSensitive').checked;
    const removeEmpty = document.getElementById('removeEmpty').checked;
    const sortResult = document.getElementById('sortResult').checked;

    let lines = raw.split('\n');

    if (removeEmpty) {
        lines = lines.filter(line => line.trim() !== '');
    }

    const inputCount = lines.length;

    const seen = new Set();
    const result = [];

    for (const line of lines) {
        const key = caseSensitive ? line : line.toLowerCase();
        if (!seen.has(key)) {
            seen.add(key);
            result.push(line);
        }
    }

    if (sortResult) {
        result.sort((a, b) => {
            const ka = caseSensitive ? a : a.toLowerCase();
            const kb = caseSensitive ? b : b.toLowerCase();
            return ka.localeCompare(kb, 'ko');
        });
    }

    const outputCount = result.length;
    const removedCount = inputCount - outputCount;

    document.getElementById('outputText').value = result.join('\n');
    document.getElementById('stats').innerHTML =
        '입력 <strong>' + inputCount + '줄</strong> &rarr; 결과 <strong>' + outputCount + '줄</strong> (<strong>' + removedCount + '개</strong> 중복 제거됨)';

    document.getElementById('resultArea').style.display = 'block';

    const copyBtn = document.getElementById('copyBtn');
    copyBtn.textContent = '복사';
    copyBtn.classList.remove('copied');
}

function copyResult() {
    const text = document.getElementById('outputText').value;
    if (!text) return;

    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '복사됨!';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '복사';
            btn.classList.remove('copied');
        }, 2000);
    });
}
</script>

</body>
</html>
