<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최대공약수 최소공배수 계산기 - MOGU Tools</title>
    <meta name="description" content="두 수의 최대공약수(GCD)와 최소공배수(LCM)를 계산합니다.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px;margin-bottom:16px}.input-row{display:flex;gap:12px;margin-bottom:16px}.input-row input{flex:1;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:18px;text-align:center;outline:none}.input-row input:focus{border-color:#4a90d9}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result-card{background:#f8f9fa;border-radius:10px;padding:20px;text-align:center}.result-card .label{font-size:13px;color:#888;margin-bottom:4px}.result-card .val{font-size:32px;font-weight:700;color:#4a90d9}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>최대공약수 · 최소공배수</h1>
    <p class="subtitle">두 수의 GCD와 LCM을 계산합니다.</p>
    <div class="calc-box">
        <div class="input-row">
            <input type="number" id="a" placeholder="숫자 1" oninput="calc()">
            <input type="number" id="b" placeholder="숫자 2" oninput="calc()">
        </div>
        <div class="results">
            <div class="result-card"><div class="label">최대공약수 (GCD)</div><div class="val" id="gcd">-</div></div>
            <div class="result-card"><div class="label">최소공배수 (LCM)</div><div class="val" id="lcm">-</div></div>
        </div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">공유하기:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function calc(){const a=parseInt(document.getElementById('a').value),b=parseInt(document.getElementById('b').value);if(isNaN(a)||isNaN(b)||a===0||b===0){document.getElementById('gcd').textContent='-';document.getElementById('lcm').textContent='-';return;}const g=gcd(a,b);document.getElementById('gcd').textContent=g;document.getElementById('lcm').textContent=Math.abs(a*b)/g;}
</script>
</body>
</html>
