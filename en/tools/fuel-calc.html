<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Economy Calculator - MOGU Tools</title>
    <meta name="description" content="Calculate fuel economy (MPG, km/L, L/100km) from distance and fuel used.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#555}.input-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}.input-group input:focus{border-color:#4a90d9}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.result-card{background:#f8f9fa;border-radius:10px;padding:16px;text-align:center}.result-card .val{font-size:28px;font-weight:700;color:#4a90d9}.result-card .label{font-size:12px;color:#888;margin-top:4px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>⛽ Fuel Economy Calculator</h1>
    <p class="subtitle">Calculate fuel efficiency from distance traveled and fuel used.</p>
    <div class="calc-box">
        <div class="input-group"><label>Distance (miles)</label><input type="number" id="dist" placeholder="300" oninput="calc()"></div>
        <div class="input-group"><label>Fuel Used (gallons)</label><input type="number" id="fuel" placeholder="10" oninput="calc()"></div>
        <div class="input-group"><label>Fuel Price ($/gallon, optional)</label><input type="number" id="price" placeholder="3.50" oninput="calc()"></div>
        <div class="results">
            <div class="result-card"><div class="val" id="mpg">-</div><div class="label">MPG (US)</div></div>
            <div class="result-card"><div class="val" id="kml">-</div><div class="label">km/L</div></div>
            <div class="result-card"><div class="val" id="lpk">-</div><div class="label">L/100km</div></div>
            <div class="result-card"><div class="val" id="cost">-</div><div class="label">Cost per mile</div></div>
        </div>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){
    const d=parseFloat(document.getElementById('dist').value),
          f=parseFloat(document.getElementById('fuel').value),
          p=parseFloat(document.getElementById('price').value);
    if(!d||!f)return;
    const mpg=d/f;
    const kml=mpg*1.60934/3.78541;
    document.getElementById('mpg').textContent=mpg.toFixed(1);
    document.getElementById('kml').textContent=kml.toFixed(1);
    document.getElementById('lpk').textContent=(100/kml).toFixed(1);
    document.getElementById('cost').textContent=p?'$'+(p/mpg).toFixed(2):'-';
}
</script>
</body>
</html>
