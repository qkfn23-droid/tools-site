<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Frequency Analyzer - MOGU Tools</title>
    <link rel="canonical" href="https://mogutool.com/en/tools/word-freq.html">
    <meta property="og:title" content="Word Frequency Analyzer - MOGU Tools">
    <meta property="og:description" content="Analyze and count the most frequently used words in a text.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mogutool.com/en/tools/word-freq.html">
    <meta name="description" content="Analyze and count the most frequently used words in a text.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}textarea{width:100%;height:150px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;margin-bottom:16px}textarea:focus{border-color:#4a90d9}.freq-list{background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden}.freq-item{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid #f0f0f0;font-size:14px}.freq-item:last-child{border-bottom:none}.freq-item .rank{color:#999;min-width:30px}.freq-item .word{flex:1;font-weight:600}.freq-item .count{color:#4a90d9;font-weight:700}.freq-item .bar{height:6px;background:#4a90d9;border-radius:3px;margin-left:12px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>📊 Word Frequency Analyzer</h1>
    <p class="subtitle">Find the most frequently used words in your text.</p>
    <textarea id="input" placeholder="Paste or type your text here..." oninput="analyze()"></textarea>
    <div class="freq-list" id="result"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function analyze(){const text=document.getElementById('input').value.toLowerCase();const words=text.match(/[a-z']+/g);if(!words){document.getElementById('result').innerHTML='';return;}
const freq={};words.forEach(w=>{if(w.length>1)freq[w]=(freq[w]||0)+1;});
const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,30);const max=sorted[0]?sorted[0][1]:1;
document.getElementById('result').innerHTML=sorted.map(([w,c],i)=>`<div class="freq-item"><span class="rank">${i+1}</span><span class="word">${w}</span><span class="count">${c}</span><div class="bar" style="width:${c/max*100}px"></div></div>`).join('');}
</script>
</body>
</html>
