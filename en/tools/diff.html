    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:800px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}@media(max-width:600px){.editor{grid-template-columns:1fr}}textarea{width:100%;height:200px;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:monospace;resize:vertical;outline:none}textarea:focus{border-color:#4a90d9}label{font-size:13px;color:#555;font-weight:500;display:block;margin-bottom:6px}.btn{padding:10px 24px;background:#4a90d9;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}.btn:hover{background:#3a7bc8}.diff-result{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:16px;font-family:monospace;font-size:13px;line-height:1.8;white-space:pre-wrap}.diff-add{background:#d4edda;color:#155724}.diff-del{background:#f8d7da;color:#721c24;text-decoration:line-through}.diff-same{color:#666}.stats{font-size:13px;color:#888;margin-bottom:12px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Text Diff</h1>
    <p class="subtitle">Compare two texts and highlight differences.</p>
    <div class="editor">
        <div><label>Original Text</label><textarea id="text1" placeholder="Original text..."></textarea></div>
        <div><label>Modified Text</label><textarea id="text2" placeholder="Modified text..."></textarea></div>
    </div>
    <button class="btn" onclick="compare()">🔍 Compare</button>
    <div class="stats" id="stats"></div>
    <div class="diff-result" id="result"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function compare(){const a=document.getElementById('text1').value.split('\n'),b=document.getElementById('text2').value.split('\n');let html='',added=0,removed=0,same=0;const max=Math.max(a.length,b.length);for(let i=0;i<max;i++){const la=a[i]||'',lb=b[i]||'';if(la===lb){html+=`<div class="diff-same">  ${la}</div>`;same++;}else{if(la)html+=`<div class="diff-del">- ${la}</div>`,removed++;if(lb)html+=`<div class="diff-add">+ ${lb}</div>`,added++;}}document.getElementById('result').innerHTML=html||'<div class="diff-same">No differences found.</div>';document.getElementById('stats').textContent=`Same: ${same} line${same!==1?'s':''} | Added: +${added} | Removed: -${removed}`;}
</script>
</body>
