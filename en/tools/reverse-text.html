<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Text - MOGU Tools</title>
    <meta name="description" content="Reverse text in different ways: reverse characters, words, or lines.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}textarea{width:100%;height:120px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;resize:vertical;outline:none;margin-bottom:12px}textarea:focus{border-color:#4a90d9}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{padding:10px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer}.btn:hover{border-color:#4a90d9;color:#4a90d9}.btn-primary{background:#4a90d9;color:#fff;border-color:#4a90d9}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Reverse Text</h1>
    <p class="subtitle">Reverse your text in multiple ways.</p>
    <textarea id="input" placeholder="Enter text here..." oninput="reverseAll()"></textarea>
    <div class="btn-row">
        <button class="btn btn-primary" onclick="copy()">📋 Copy</button>
    </div>
    <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;">🔄 Reverse Characters</label>
    <textarea id="r1" readonly style="background:#f8f9fa;height:80px;"></textarea>
    <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;margin-top:12px;">🔄 Reverse Words</label>
    <textarea id="r2" readonly style="background:#f8f9fa;height:80px;"></textarea>
    <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;margin-top:12px;">🔄 Reverse Lines</label>
    <textarea id="r3" readonly style="background:#f8f9fa;height:80px;"></textarea>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function reverseAll(){const t=document.getElementById('input').value;document.getElementById('r1').value=[...t].reverse().join('');document.getElementById('r2').value=t.split(' ').reverse().join(' ');document.getElementById('r3').value=t.split('\n').reverse().join('\n');}
function copy(){document.getElementById('r1').select();document.execCommand('copy');}
</script>
</body>
</html>
