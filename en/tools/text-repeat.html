<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Repeat - MOGU Tools</title>
    <meta name="description" content="Repeat any text a specified number of times.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;margin-bottom:6px;color:#555}.input-group input,.input-group textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}.input-group textarea{height:80px;resize:vertical}textarea:focus,input:focus{border-color:#4a90d9}.btn-row{display:flex;gap:8px;margin-bottom:12px}.btn{padding:10px 16px;border:1px solid #ddd;border-radius:8px;background:#4a90d9;color:#fff;font-size:13px;cursor:pointer}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🔁 Text Repeat</h1>
    <div class="calc-box">
        <div class="input-group"><label>Text</label><input type="text" id="text" placeholder="Text to repeat" oninput="repeat()"></div>
        <div class="input-group"><label>Repeat Count</label><input type="number" id="count" value="5" min="1" max="10000" oninput="repeat()"></div>
        <div class="input-group"><label>Separator</label>
            <select id="sep" onchange="repeat()">
                <option value="\n">New Line</option>
                <option value=" ">Space</option>
                <option value=", ">Comma</option>
                <option value="">None</option>
            </select>
        </div>
        <div class="btn-row"><button class="btn" onclick="document.getElementById('output').select();document.execCommand('copy')">📋 Copy</button></div>
        <div class="input-group"><label>Result</label><textarea id="output" readonly style="background:#f8f9fa;height:150px;"></textarea></div>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>function repeat(){const t=document.getElementById('text').value,n=Math.min(parseInt(document.getElementById('count').value)||1,10000),s=document.getElementById('sep').value.replace('\\n','\n');document.getElementById('output').value=Array(n).fill(t).join(s);}</script>
</body>
</html>
