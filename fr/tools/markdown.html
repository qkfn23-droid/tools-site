<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur Markdown - MOGU Tools</title>
    <meta name="description" content="Convertissez le Markdown en HTML en temps réel. Prévisualisation incluse.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:900px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:16px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}@media(max-width:600px){.editor{grid-template-columns:1fr}}.editor textarea{height:400px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:'Fira Code',monospace;resize:vertical;outline:none;line-height:1.6}.editor textarea:focus{border-color:#4a90d9}.preview{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px;min-height:400px;overflow-y:auto;font-size:14px;line-height:1.7}.preview h1,.preview h2,.preview h3{margin:16px 0 8px;color:#333}.preview h1{font-size:24px;border-bottom:1px solid #eee;padding-bottom:8px}.preview h2{font-size:20px}.preview h3{font-size:16px}.preview p{margin:8px 0}.preview code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:13px}.preview pre{background:#f0f0f0;padding:12px;border-radius:8px;overflow-x:auto;margin:12px 0}.preview blockquote{border-left:4px solid #4a90d9;padding:8px 16px;margin:12px 0;color:#666;background:#f8f9fa}.preview ul,.preview ol{margin:8px 0 8px 20px}.preview a{color:#4a90d9}.preview hr{border:none;border-top:1px solid #eee;margin:16px 0}.preview img{max-width:100%}.btn-row{display:flex;gap:8px;margin-bottom:12px}.btn{padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:12px;cursor:pointer}.btn:hover{border-color:#4a90d9;color:#4a90d9}label{font-size:13px;color:#555;font-weight:600;display:block;margin-bottom:6px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>Éditeur Markdown</h1>
    <p class="subtitle">Prévisualisez le Markdown en temps réel.</p>
    <div class="btn-row">
        <button class="btn" onclick="copy()">📋 Copier le HTML</button>
    </div>
    <div class="editor">
        <div><label>Markdown</label><textarea id="input" oninput="render()" placeholder="# Titre&#10;&#10;**Gras** *Italique*&#10;&#10;- Élément 1&#10;- Élément 2&#10;&#10;> Citation&#10;&#10;`code`"></textarea></div>
        <div><label>Aperçu</label><div class="preview" id="preview"></div></div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function md2html(md){return md
.replace(/^### (.*$)/gm,'<h3>$1</h3>')
.replace(/^## (.*$)/gm,'<h2>$1</h2>')
.replace(/^# (.*$)/gm,'<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`(.+?)`/g,'<code>$1</code>')
.replace(/^> (.*$)/gm,'<blockquote>$1</blockquote>')
.replace(/^- (.*$)/gm,'<li>$1</li>')
.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
.replace(/^\d+\. (.*$)/gm,'<li>$1</li>')
.replace(/^---$/gm,'<hr>')
.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>')
.replace(/!\[(.+?)\]\((.+?)\)/g,'<img src="$2" alt="$1">')
.replace(/\n\n/g,'</p><p>')
.replace(/^(?!<[hublop])/gm,function(m){return m?'<p>'+m:m;});}
function render(){document.getElementById('preview').innerHTML=md2html(document.getElementById('input').value);}
function copy(){const html=md2html(document.getElementById('input').value);navigator.clipboard.writeText(html);}
document.getElementById('input').value='# Éditeur Markdown\n\n**Gras** *Italique* `code`\n\n## Fonctionnalités\n\n- Aperçu en temps réel\n- Conversion HTML\n- Copie facile\n\n> Exemple de citation\n\n---\n\n[MOGU Tools](https://mogutool.com)';
render();
</script>
</body>
</html>
