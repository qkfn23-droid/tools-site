<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre en lettres - MOGU Tools</title>
    <meta name="description" content="Convertissez un nombre en lettres en français et en anglais.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px;margin-bottom:12px}input[type=number]{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:18px;outline:none;margin-bottom:16px;text-align:center}input:focus{border-color:#4a90d9}.result{background:#f8f9fa;border-radius:10px;padding:16px;margin-bottom:8px}.result .label{font-size:12px;color:#888;margin-bottom:4px}.result .val{font-size:18px;font-weight:600;color:#4a90d9;word-break:break-all}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🔢 Nombre en lettres</h1>
    <div class="calc-box">
        <input type="number" id="num" placeholder="12345" oninput="convert()">
        <div class="result"><div class="label">Français</div><div class="val" id="fr">-</div></div>
        <div class="result"><div class="label">Français (montant en euros)</div><div class="val" id="frm">-</div></div>
        <div class="result"><div class="label">English</div><div class="val" id="en">-</div></div>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function numToFr(n){if(n===0)return'zéro';const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];const t=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];function below100(n){if(n<20)return u[n];const d=Math.floor(n/10),r=n%10;if(d===7)return t[d]+(r===1?'-et-onze':r?'-'+u[10+r]:'');if(d===9)return t[d]+(r?'-'+u[10+r]:r===0?'s':'');return t[d]+(r===1&&d<8?'-et-un':r?'-'+u[r]:d===8?'s':'');}function below1000(n){if(n<100)return below100(n);const h=Math.floor(n/100),r=n%100;return(h===1?'cent':u[h]+' cent')+(r?(h>1?' ':'s ').replace('s ','  ')+(r?' '+below100(r):''):'');}let neg=n<0;if(neg)n=-n;if(n<100)return(neg?'moins ':'')+below100(n);if(n<1000)return(neg?'moins ':'')+below1000(n);const scales=['','mille','million','milliard'];const chunks=[];let tmp=n;while(tmp>0){chunks.unshift(tmp%1000);tmp=Math.floor(tmp/1000);}return(neg?'moins ':'')+chunks.map((c,i)=>{const s=scales[chunks.length-1-i];if(c===0)return'';if(c===1&&s==='mille')return'mille';return below1000(c)+' '+s;}).filter(Boolean).join(' ').trim();}
function numToEn(n){if(n===0)return'zero';const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];const scales=['','thousand','million','billion','trillion'];if(n<0)return'negative '+numToEn(-n);if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' and '+numToEn(n%100):'');let s='',i=0;while(n>0){const chunk=n%1000;if(chunk)s=(numToEn(chunk)+' '+scales[i]+' '+s).trim();n=Math.floor(n/1000);i++;}return s.trim();}
function convert(){const n=parseInt(document.getElementById('num').value);if(isNaN(n)){document.getElementById('fr').textContent='-';document.getElementById('frm').textContent='-';document.getElementById('en').textContent='-';return;}
document.getElementById('fr').textContent=numToFr(n);document.getElementById('frm').textContent=numToFr(n)+' euro'+(Math.abs(n)>1?'s':'');document.getElementById('en').textContent=numToEn(Math.abs(n));}
</script>
</body>
</html>
