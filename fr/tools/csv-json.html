<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV → JSON - MOGU Tools</title>
    <meta name="description" content="Convertissez des données CSV en JSON.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}textarea{width:100%;height:180px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:monospace;outline:none;margin-bottom:12px}textarea:focus{border-color:#4a90d9}.btn-row{display:flex;gap:8px;margin-bottom:12px}.btn{padding:10px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer}.btn-primary{background:#4a90d9;color:#fff;border-color:#4a90d9}label{font-size:13px;color:#555;display:block;margin-bottom:6px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>📊 CSV → JSON</h1>
    <label>Entrée CSV (première ligne = en-têtes)</label>
    <textarea id="input" placeholder="nom,age,ville&#10;Alice,30,Paris&#10;Bob,25,Lyon" oninput="convert()"></textarea>
    <div class="btn-row"><button class="btn btn-primary" onclick="convert()">Convertir</button><button class="btn" onclick="document.getElementById('output').select();document.execCommand('copy')">📋 Copier</button></div>
    <label>Résultat JSON</label>
    <textarea id="output" readonly style="background:#f8f9fa;"></textarea>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function convert(){try{const lines=document.getElementById('input').value.trim().split('\n');if(lines.length<2){document.getElementById('output').value='';return;}
const headers=lines[0].split(',').map(h=>h.trim());const data=lines.slice(1).map(line=>{const vals=line.split(',');const obj={};headers.forEach((h,i)=>obj[h]=vals[i]?.trim()||'');return obj;});
document.getElementById('output').value=JSON.stringify(data,null,2);}catch(e){document.getElementById('output').value='Erreur : '+e.message;}}
</script>
</body>
</html>
