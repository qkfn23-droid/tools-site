    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}textarea{width:100%;height:120px;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;background:#fff}textarea:focus{border-color:#4a90d9}.btn{width:100%;padding:14px;background:#4a90d9;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:16px;text-align:center}.result-card .val{font-size:24px;font-weight:700;color:#4a90d9}.result-card .label{font-size:12px;color:#888;margin-top:4px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>📊 Calculateur d'écart-type</h1>
    <p class="subtitle">Entrez des nombres pour calculer la moyenne, la variance et l'écart-type.</p>
    <textarea id="input" placeholder="Séparez les nombres par des virgules, des espaces ou des sauts de ligne&#10;Ex : 10, 20, 30, 40, 50" oninput="calc()"></textarea>
    <div class="results">
        <div class="result-card"><div class="val" id="mean">-</div><div class="label">Moyenne</div></div>
        <div class="result-card"><div class="val" id="std">-</div><div class="label">Écart-type (σ)</div></div>
        <div class="result-card"><div class="val" id="variance">-</div><div class="label">Variance (σ²)</div></div>
        <div class="result-card"><div class="val" id="count">-</div><div class="label">Nombre de données</div></div>
        <div class="result-card"><div class="val" id="min">-</div><div class="label">Valeur minimale</div></div>
        <div class="result-card"><div class="val" id="max">-</div><div class="label">Valeur maximale</div></div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){const nums=document.getElementById('input').value.split(/[,\s\n]+/).map(Number).filter(n=>!isNaN(n)&&n!=='');
if(nums.length===0){['mean','std','variance','count','min','max'].forEach(id=>document.getElementById(id).textContent='-');return;}
const n=nums.length,mean=nums.reduce((a,b)=>a+b,0)/n;
const variance=nums.reduce((a,b)=>a+(b-mean)**2,0)/n;
const std=Math.sqrt(variance);
document.getElementById('mean').textContent=mean.toFixed(4);
document.getElementById('std').textContent=std.toFixed(4);
document.getElementById('variance').textContent=variance.toFixed(4);
document.getElementById('count').textContent=n;
document.getElementById('min').textContent=Math.min(...nums);
document.getElementById('max').textContent=Math.max(...nums);}
</script>
