<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche d'emoji - MOGU Tools</title>
    <meta name="description" content="Recherchez et copiez des emojis en cliquant dessus.">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:16px}input[type=text]{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none;margin-bottom:16px}input:focus{border-color:#4a90d9}.copied{font-size:13px;color:#27ae60;min-height:20px;margin-bottom:8px}.grid{display:flex;flex-wrap:wrap;gap:4px}.emoji-btn{width:44px;height:44px;border:none;background:#fff;border-radius:8px;font-size:24px;cursor:pointer;transition:transform 0.1s}.emoji-btn:hover{transform:scale(1.3);background:#f0f6fd}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>😀 Recherche d'emoji</h1>
    <p class="subtitle">Cliquez pour copier. Utilisez la recherche pour trouver un emoji.</p>
    <input type="text" id="search" placeholder="Rechercher : smile, heart, star, animal..." oninput="filter()">
    <div class="copied" id="copied"></div>
    <div class="grid" id="grid"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const EMOJIS=[
{e:'😀',k:'smile grin happy sourire'},{e:'😂',k:'laugh cry tears rire larmes'},{e:'🥹',k:'touched emu'},{e:'😍',k:'love heart eyes amour coeur'},{e:'😎',k:'cool sunglasses lunettes'},{e:'🤔',k:'think penser reflexion'},{e:'😢',k:'sad cry triste pleurs'},{e:'😡',k:'angry colere fache'},{e:'🥺',k:'please cute mignon'},{e:'😱',k:'shock scream choc cri'},{e:'🤣',k:'rofl fou rire'},{e:'😴',k:'sleep sommeil dormir'},{e:'🤮',k:'vomit sick malade'},{e:'🤯',k:'explode mind blown incroyable'},
{e:'❤️',k:'heart love red coeur rouge amour'},{e:'💔',k:'broken heart coeur brise'},{e:'💕',k:'hearts love amour coeurs'},{e:'🔥',k:'fire hot feu chaud'},{e:'⭐',k:'star etoile'},{e:'✨',k:'sparkle shine briller'},{e:'🌈',k:'rainbow arc en ciel'},{e:'☀️',k:'sun soleil'},{e:'🌙',k:'moon lune'},{e:'❄️',k:'snow neige'},{e:'🌸',k:'cherry blossom fleur cerisier'},{e:'🌹',k:'rose'},
{e:'👍',k:'thumbs up good bien pouce'},{e:'👎',k:'thumbs down bad mauvais'},{e:'👏',k:'clap applaudir'},{e:'🙏',k:'pray please thanks merci prier'},{e:'💪',k:'muscle strong fort'},{e:'✌️',k:'peace victory paix victoire'},{e:'🤝',k:'handshake deal accord poignee main'},{e:'👋',k:'wave hello bye bonjour aurevoir'},
{e:'🐶',k:'dog chien'},{e:'🐱',k:'cat chat'},{e:'🐻',k:'bear ours'},{e:'🐼',k:'panda'},{e:'🦊',k:'fox renard'},{e:'🐵',k:'monkey singe'},{e:'🐷',k:'pig cochon'},{e:'🐸',k:'frog grenouille'},{e:'🦋',k:'butterfly papillon'},{e:'🐍',k:'snake serpent'},
{e:'🍎',k:'apple pomme'},{e:'🍕',k:'pizza'},{e:'🍔',k:'burger hamburger'},{e:'🍟',k:'fries frites'},{e:'🍜',k:'noodle ramen nouilles'},{e:'🍣',k:'sushi'},{e:'🍺',k:'beer biere'},{e:'☕',k:'coffee cafe'},{e:'🎂',k:'cake birthday gateau anniversaire'},
{e:'🎉',k:'party celebrate fete'},{e:'🎊',k:'confetti celebration'},{e:'🎁',k:'gift present cadeau'},{e:'🏆',k:'trophy winner trophee gagnant'},{e:'🎵',k:'music note musique'},{e:'🎮',k:'game controller jeu'},{e:'📱',k:'phone mobile telephone'},{e:'💻',k:'laptop computer ordinateur portable'},{e:'📧',k:'email mail'},{e:'📷',k:'camera photo'},
{e:'✅',k:'check done valide termine'},{e:'❌',k:'x wrong no non faux'},{e:'⚠️',k:'warning attention'},{e:'💡',k:'idea bulb idee ampoule'},{e:'🔑',k:'key cle'},{e:'🔒',k:'lock cadenas verrou'},{e:'⏰',k:'alarm clock alarme horloge'},{e:'📌',k:'pin epingle'},{e:'🗑️',k:'trash delete poubelle supprimer'},{e:'💯',k:'100 perfect parfait'}
];
function render(list){document.getElementById('grid').innerHTML=list.map(e=>`<button class="emoji-btn" onclick="copy('${e.e}')">${e.e}</button>`).join('');}
function filter(){const q=document.getElementById('search').value.toLowerCase();const filtered=q?EMOJIS.filter(e=>e.k.includes(q)):EMOJIS;render(filtered);}
function copy(e){navigator.clipboard.writeText(e);document.getElementById('copied').textContent=`${e} copié !`;setTimeout(()=>document.getElementById('copied').textContent='',1500);}
render(EMOJIS);
</script>
</body>
</html>
