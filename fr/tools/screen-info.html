<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résolution d'Écran - MOGU Tools</title>
    <meta name="description" content="Vérifiez la résolution d'écran, la taille du navigateur, la densité de pixels et les informations OS de votre appareil.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        header { background: #fff; border-bottom: 2px solid #eee; padding: 16px 20px; }
        header a { text-decoration: none; color: #2c2c2c; font-size: 18px; font-weight: 700; }
        header a span { color: #4a90d9; }
        .breadcrumb { max-width: 600px; margin: 16px auto; padding: 0 20px; font-size: 13px; color: #999; }
        .breadcrumb a { color: #4a90d9; text-decoration: none; }
        .container { max-width: 600px; margin: 10px auto 40px; padding: 0 20px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media (max-width: 480px) { .info-grid { grid-template-columns: 1fr; } }
        .info-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 20px; }
        .info-card .label { font-size: 12px; color: #999; margin-bottom: 4px; text-transform: uppercase; }
        .info-card .val { font-size: 24px; font-weight: 700; color: #4a90d9; }
        .info-card .desc { font-size: 12px; color: #888; margin-top: 6px; }
        .info-card.full { grid-column: 1 / -1; }

        .visual { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 20px; }
        .visual .screen-box { display: inline-block; border: 3px solid #4a90d9; border-radius: 8px; padding: 20px 30px; margin: 10px; }
        .visual .screen-label { font-size: 12px; color: #888; margin-top: 8px; }

        footer { text-align: center; padding: 30px; color: #bbb; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <a href="../index.html">MOGU <span>Tools</span></a>
</header>

<div class="breadcrumb">
    <a href="../index.html">Accueil</a> &gt; Outils &gt; Résolution d'Écran
</div>

<div class="container">
    <h1>Résolution d'Écran</h1>
    <p class="subtitle">Vérifiez les informations d'écran de votre appareil actuel.</p>

    <div class="info-grid" id="infoGrid"></div>

    <div class="visual" id="visual"></div>
</div>

<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'<footer>text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>

<script>
function detect() {
    const sw = screen.width, sh = screen.height;
    const bw = window.innerWidth, bh = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    const realW = Math.round(sw * dpr), realH = Math.round(sh * dpr);
    const colorDepth = screen.colorDepth;
    const orientation = sw > sh ? 'Paysage (Landscape)' : 'Portrait';
    const ua = navigator.userAgent;
    let os = 'Inconnu';
    if (ua.includes('Windows')) os = 'Windows';
    else if (ua.includes('Mac')) os = 'macOS';
    else if (ua.includes('Linux')) os = 'Linux';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

    let browser = 'Inconnu';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Chrome';
    else if (ua.includes('Firefox')) browser = 'Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Edge';

    const isMobile = /Mobi|Android|iPhone/i.test(ua);

    document.getElementById('infoGrid').innerHTML = `
        <div class="info-card"><div class="label">Résolution d'écran</div><div class="val">${sw} × ${sh}</div><div class="desc">En pixels CSS</div></div>
        <div class="info-card"><div class="label">Résolution physique</div><div class="val">${realW} × ${realH}</div><div class="desc">Pixels réels (DPR appliqué)</div></div>
        <div class="info-card"><div class="label">Taille du navigateur</div><div class="val">${bw} × ${bh}</div><div class="desc">Viewport (sans la barre de défilement)</div></div>
        <div class="info-card"><div class="label">Densité de pixels (DPR)</div><div class="val">${dpr}x</div><div class="desc">${dpr >= 2 ? 'Haute densité (Retina)' : 'Densité normale'}</div></div>
        <div class="info-card"><div class="label">Orientation</div><div class="val">${orientation}</div></div>
        <div class="info-card"><div class="label">Profondeur des couleurs</div><div class="val">${colorDepth} bits</div></div>
        <div class="info-card"><div class="label">Système d'exploitation</div><div class="val">${os}</div></div>
        <div class="info-card"><div class="label">Navigateur</div><div class="val">${browser}</div></div>
        <div class="info-card full"><div class="label">Type d'appareil</div><div class="val">${isMobile ? '📱 Mobile' : '💻 Ordinateur'}</div></div>
    `;

    // Visual
    const scale = 0.15;
    const vw = Math.round(sw * scale), vh = Math.round(sh * scale);
    const vbw = Math.round(bw * scale), vbh = Math.round(bh * scale);
    document.getElementById('visual').innerHTML = `
        <div class="screen-box" style="width:${vw}px;height:${vh}px;position:relative;">
            <div style="position:absolute;top:4px;left:4px;font-size:10px;color:#999;">${sw}×${sh}</div>
            <div style="border:2px dashed #27ae60;border-radius:4px;width:${vbw}px;height:${vbh}px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
                <div style="font-size:9px;color:#27ae60;text-align:center;margin-top:${Math.max(vbh/2-8,2)}px;">${bw}×${bh}</div>
            </div>
        </div>
        <div class="screen-label">🔵 Résolution d'écran &nbsp; 🟢 Viewport navigateur</div>
    `;
}

detect();
window.addEventListener('resize', detect);
</script>

</body>
</html>
