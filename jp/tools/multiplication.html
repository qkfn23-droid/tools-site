<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九表 - MOGU Tools</title>
    <meta name="description" content="九九表を生成します。">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:700px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px}.card h3{font-size:16px;color:#4a90d9;margin-bottom:8px;text-align:center}.card p{font-size:13px;color:#555;line-height:1.8}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>✖️ 九九表</h1>
    <div class="grid" id="grid"></div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const grid=document.getElementById('grid');for(let i=2;i<=9;i++){let html=`<div class="card"><h3>${i}の段</h3><p>`;for(let j=1;j<=9;j++)html+=`${i} × ${j} = ${i*j}<br>`;html+='</p></div>';grid.innerHTML+=html;}
</script>
</body>
</html>
