<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速度・距離・時間計算機 - MOGU Tools</title>
    <meta name="description" content="速度、距離、時間のうち一つを計算します。">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px;margin-bottom:16px}.calc-box h2{font-size:15px;color:#555;margin-bottom:14px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;margin-bottom:6px;color:#555}.input-row{display:flex;gap:8px}.input-row input{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}.input-row input:focus{border-color:#4a90d9}.result{background:#f8f9fa;border-radius:10px;padding:20px;text-align:center;margin-top:16px}.result .big{font-size:36px;font-weight:700;color:#4a90d9}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>
</head>
<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>速度 · 距離 · 時間 計算機</h1>
    <p class="subtitle">3つのうち2つを入力すると残り1つを計算します。</p>
    <div class="calc-box">
        <div class="input-group"><label>速度 (km/h)</label><input type="number" id="speed" oninput="calc()" placeholder="空欄にすると計算されます"></div>
        <div class="input-group"><label>距離 (km)</label><input type="number" id="dist" oninput="calc()" placeholder="空欄にすると計算されます"></div>
        <div class="input-group"><label>時間 (時間)</label><input type="number" id="time" oninput="calc()" step="0.1" placeholder="空欄にすると計算されます"></div>
        <div class="result"><div class="big" id="result">2つの値を入力してください</div></div>
    </div>
</div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){const s=document.getElementById('speed').value,d=document.getElementById('dist').value,t=document.getElementById('time').value;const sv=parseFloat(s),dv=parseFloat(d),tv=parseFloat(t);let r='2つの値を入力してください';if(s&&d&&!t){r=`時間: ${(dv/sv).toFixed(2)} 時間 (${Math.round(dv/sv*60)}分)`;}else if(s&&!d&&t){r=`距離: ${(sv*tv).toFixed(2)} km`;}else if(!s&&d&&t){r=`速度: ${(dv/tv).toFixed(2)} km/h`;}else if(s&&d&&t){r=`速度:${sv} 距離:${dv} 時間:${tv} (すべて入力済み)`;}document.getElementById('result').innerHTML=r;}
</script>
</body>
</html>
