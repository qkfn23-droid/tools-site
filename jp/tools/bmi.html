<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>BMI計算機 - MOGU Tools</title>
 <meta name="description" content="Calculate your Body Mass Index (BMI) by entering your height and weight. Free online BMI calculator.">
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
 header { background: #fff; border-bottom: 2px solid #eee; padding: 16px 20px; }
 header a { text-decoration: none; color: #2c2c2c; font-size: 18px; font-weight: 700; }
 header a span { color: #4a90d9; }
 .breadcrumb { max-width: 600px; margin: 16px auto; padding: 0 20px; font-size: 13px; color: #999; }
 .breadcrumb a { color: #4a90d9; text-decoration: none; }
 .container { max-width: 600px; margin: 10px auto 40px; padding: 0 20px; }
 h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
 .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
 .calc-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 28px; }
 .input-group { margin-bottom: 20px; }
 .input-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #555; }
 .input-row { display: flex; align-items: center; gap: 8px; }
 .input-row input { flex: 1; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
 .input-row input:focus { border-color: #4a90d9; }
 .input-row .unit { font-size: 14px; color: #999; min-width: 30px; }
 .calc-btn { width: 100%; padding: 14px; background: #4a90d9; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
 .calc-btn:hover { background: #3a7bc8; }
 .result { display: none; margin-top: 24px; text-align: center; padding: 24px; border-radius: 10px; background: #f8f9fa; }
 .result .bmi-number { font-size: 48px; font-weight: 700; }
 .result .bmi-label { font-size: 18px; font-weight: 600; margin-top: 6px; }
 .result .bmi-range { font-size: 13px; color: #999; margin-top: 4px; }
 .bmi-table { margin-top: 24px; width: 100%; border-collapse: collapse; }
 .bmi-table th, .bmi-table td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #eee; }
 .bmi-table th { color: #888; font-weight: 500; }
 .bmi-table tr.active { background: #eef4fb; font-weight: 600; }
 .color-underweight { color: #5bc0de; }
 .color-normal { color: #5cb85c; }
 .color-overweight { color: #f0ad4e; }
 .color-obese { color: #d9534f; }
 .color-extreme { color: #c9302c; }
 .info-section { margin-top: 30px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 24px; }
 .info-section h2 { font-size: 16px; margin-bottom: 12px; color: #555; }
 .info-section p { font-size: 14px; color: #666; line-height: 1.7; }
 footer { text-align: center; padding: 30px; color: #bbb; font-size: 13px; }
 </style>
</head>
<body>

<header>
 <a href="../index.html">MOGU <span>ツール</span></a>
</header>

<div class="breadcrumb">
 <a href="../index.html">ホーム</a> &gt; 計算ツール &gt; BMI Calculator
</div>

<div class="container">
 <h1>BMI計算機</h1>
 <p class="subtitle">身長と体重を入力してBMI（体格指数）を計算します。</p>

 <div class="calc-box">
 <div class="input-group">
 <label>身長</label>
 <div class="input-row">
 <input type="number" id="height" placeholder="170" step="0.1" min="50" max="250">
 <span class="unit">cm</span>
 </div>
 </div>

 <div class="input-group">
 <label>体重</label>
 <div class="input-row">
 <input type="number" id="weight" placeholder="65" step="0.1" min="10" max="500">
 <span class="unit">kg</span>
 </div>
 </div>

 <button class="calc-btn" onclick="calculate()">計算する</button>

 <div class="result" id="result">
 <div class="bmi-number" id="bmiNumber">-</div>
 <div class="bmi-label" id="bmiLabel">-</div>
 <div class="bmi-range" id="bmiRange">-</div>

 <table class="bmi-table">
 <tr>
 <th>カテゴリ</th>
 <th>BMI範囲</th>
 </tr>
 <tr id="row-underweight">
 <td class="color-underweight">低体重</td>
 <td>18.5未満</td>
 </tr>
 <tr id="row-normal">
 <td class="color-normal">正常</td>
 <td>18.5 – 24.9</td>
 </tr>
 <tr id="row-overweight">
 <td class="color-overweight">過体重</td>
 <td>25.0 – 29.9</td>
 </tr>
 <tr id="row-obese">
 <td class="color-obese">肥満</td>
 <td>30.0 – 34.9</td>
 </tr>
 <tr id="row-extreme">
 <td class="color-extreme">高度肥満</td>
 <td>35.0以上</td>
 </tr>
 </table>
 </div>
 </div>

 <div class="info-section">
 <h2>BMIとは？</h2>
 <p>
 BMI（体格指数）は体重（kg）を身長（m）の二乗で割って算出します。
 体重状態を評価するために最も広く使われている指標です。
 上記のカテゴリはWHO国際基準に従っています。
 </p>
 </div>
</div>

<footer>
 &copy; 2025 MOGU Tools
</footer>

<script>
function calculate() {
 const height = parseFloat(document.getElementById('height').value);
 const weight = parseFloat(document.getElementById('weight').value);

 if (!height || !weight || height <= 0 || weight <= 0) {
 alert('身長と体重を正しく入力してください。');
 return;
 }

 const heightM = height / 100;
 const bmi = weight / (heightM * heightM);
 const bmiRound = Math.round(bmi * 10) / 10;

 let label, colorClass, rowId;
 if (bmi < 18.5) {
 label = '低体重'; colorClass = 'color-underweight'; rowId = 'row-underweight';
 } else if (bmi < 25) {
 label = '正常'; colorClass = 'color-normal'; rowId = 'row-normal';
 } else if (bmi < 30) {
 label = '過体重'; colorClass = 'color-overweight'; rowId = 'row-overweight';
 } else if (bmi < 35) {
 label = '肥満'; colorClass = 'color-obese'; rowId = 'row-obese';
 } else {
 label = '高度肥満'; colorClass = 'color-extreme'; rowId = 'row-extreme';
 }

 document.getElementById('bmiNumber').textContent = bmiRound;
 document.getElementById('bmiNumber').className = 'bmi-number ' + colorClass;
 document.getElementById('bmiLabel').textContent = label;
 document.getElementById('bmiLabel').className = 'bmi-label ' + colorClass;

 const normalMin = (18.5 * heightM * heightM).toFixed(1);
 const normalMax = (24.9 * heightM * heightM).toFixed(1);
 document.getElementById('bmiRange').textContent =
 '正常体重範囲: ' + normalMin + 'kg – ' + normalMax + 'kg';

 document.querySelectorAll('.bmi-table tr').forEach(tr => tr.classList.remove('active'));
 document.getElementById(rowId).classList.add('active');

 document.getElementById('result').style.display = 'block';
}

document.addEventListener('keydown', function(e) {
 if (e.key === 'Enter') calculate();
});
</script>

</body>
</html>
