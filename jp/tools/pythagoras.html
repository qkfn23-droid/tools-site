    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}header{background:#fff;border-bottom:2px solid #eee;padding:16px 20px}header a{text-decoration:none;color:#2c2c2c;font-size:18px;font-weight:700}header a span{color:#4a90d9}.container{max-width:600px;margin:10px auto 40px;padding:0 20px}h1{font-size:24px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:24px}.calc-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:24px}.input-group{margin-bottom:16px}.input-group label{display:block;font-size:14px;margin-bottom:6px;color:#555}.input-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}.result{margin-top:20px;text-align:center;padding:20px;background:#f8f9fa;border-radius:10px}.result .big{font-size:36px;font-weight:700;color:#4a90d9}.result .formula{font-size:14px;color:#888;margin-top:8px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}</style>

<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>📐 ピタゴラス計算機</h1>
    <p class="subtitle">a² + b² = c² — 2辺を入力すると残りの辺を計算します。</p>
    <div class="calc-box">
        <div class="input-group"><label>辺 a（空欄なら計算）</label><input type="number" id="a" oninput="calc()" placeholder="3"></div>
        <div class="input-group"><label>辺 b（空欄なら計算）</label><input type="number" id="b" oninput="calc()" placeholder="4"></div>
        <div class="input-group"><label>斜辺 c（空欄なら計算）</label><input type="number" id="c" oninput="calc()" placeholder="5"></div>
        <div class="result"><div class="big" id="result">2つの値を入力してください</div><div class="formula" id="formula"></div></div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
function calc(){const a=document.getElementById('a').value,b=document.getElementById('b').value,c=document.getElementById('c').value;
const av=parseFloat(a),bv=parseFloat(b),cv=parseFloat(c);let r='2つの値を入力してください',f='';
if(a&&b&&!c){const v=Math.sqrt(av*av+bv*bv);r='c = '+v.toFixed(4);f=`√(${av}² + ${bv}²) = √${(av*av+bv*bv).toFixed(2)}`;}
else if(a&&!b&&c){if(cv<=av){r='c は a より大きくなければなりません';}else{const v=Math.sqrt(cv*cv-av*av);r='b = '+v.toFixed(4);f=`√(${cv}² - ${av}²)`;}}
else if(!a&&b&&c){if(cv<=bv){r='c は b より大きくなければなりません';}else{const v=Math.sqrt(cv*cv-bv*bv);r='a = '+v.toFixed(4);f=`√(${cv}² - ${bv}²)`;}}
document.getElementById('result').textContent=r;document.getElementById('formula').textContent=f;}
</script>
